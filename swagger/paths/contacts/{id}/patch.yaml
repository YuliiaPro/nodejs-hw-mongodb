tags:
  - Contacts
summary: Patch contact by id
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6691fa793485d6036c861c25'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: Kateryna Povalenko
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: +380000000005
          email:
            description: "Contact's email."
            type: string
          isFavourite:
            description: 'Is the contact a favorite?'
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            example: work
          photo:
            description: "Link to contact's photo"
            type: string
            example: <https://res.cloudinary.com/dguwxf5ek/image/upload/v1723358104/ronoznm4nnfejcpot7bx.jpg>
responses:
  '200':
    description: 'Patch contact by id'
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    description: 'Contact not found'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '401':
    $ref: '../../../components/responses/401.yaml'
